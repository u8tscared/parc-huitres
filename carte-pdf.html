<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La carte · Le Parc à Huîtres</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&display=swap" rel="stylesheet">
<!-- Carte imprimable, générée à partir de content/huitres.json et content/carte.json (modifiables dans /admin/).
     Le bouton « Télécharger en PDF » ouvre l'impression du navigateur : choisir « Enregistrer en PDF ». -->
<style>
:root{--navy:#13306B;--cream:#F6F7EC;--rasp:#B23A5B;--soft:#4D6191;--fd:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;--fb:Fredoka,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#d9dde6;color:var(--navy);font-family:var(--fb);font-size:10.5pt;line-height:1.3}
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px 16px;background:var(--navy);color:var(--cream)}
.bar button,.bar a{font:600 .95rem var(--fb);border-radius:999px;padding:.55em 1.1em;border:1.5px solid var(--cream);background:transparent;color:var(--cream);text-decoration:none;cursor:pointer}
.bar button.main{background:var(--cream);color:var(--navy)}
.bar button[aria-pressed="true"]{background:var(--rasp);border-color:var(--rasp)}
.bar small{flex-basis:100%;text-align:center;opacity:.8}
.sheet{width:210mm;min-height:297mm;margin:18px auto;background:var(--cream);padding:14mm 14mm 12mm;box-shadow:0 6px 24px rgba(0,0,0,.15)}
header{text-align:center;border-bottom:3px double var(--rasp);padding-bottom:6mm;margin-bottom:6mm}
header h1{font-family:var(--fd);font-weight:400;font-size:30pt;letter-spacing:.06em;text-transform:uppercase}
header p{color:var(--rasp);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:8.5pt;margin-top:2mm}
.cols{column-count:2;column-gap:10mm}
.cat{break-inside:avoid;margin-bottom:6mm}
.cat h2{font-family:var(--fd);font-weight:400;font-size:15pt;text-transform:uppercase;letter-spacing:.04em}
.cat .sub{color:var(--rasp);font-size:8.5pt;font-weight:600;margin-bottom:2mm}
.it{display:grid;grid-template-columns:1fr auto;gap:0 4mm;padding:1.3mm 0;border-bottom:1px dotted rgba(19,48,107,.3);break-inside:avoid}
.it b{font-weight:600}
.it .p{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.it .d{grid-column:1/-1;color:var(--soft);font-size:9pt}
.it .al{grid-column:1/-1;color:var(--rasp);font-size:7.5pt}
footer{margin-top:6mm;padding-top:4mm;border-top:3px double var(--rasp);text-align:center;font-size:8.5pt;color:var(--soft)}
footer b{color:var(--navy)}
@page{size:A4;margin:11mm 12mm}
@media print{body{background:var(--cream)}.bar{display:none}.sheet{margin:0;padding:0;box-shadow:none;width:auto;min-height:0}}
@media screen and (max-width:820px){.sheet{width:auto;margin:12px;padding:20px}.cols{column-count:1}}
</style>
</head>
<body>
<div class="bar">
  <button type="button" class="main" id="dl">Télécharger en PDF</button>
  <span role="group" aria-label="Langue"><button type="button" data-l="fr">FR</button> <button type="button" data-l="es">ES</button> <button type="button" data-l="en">EN</button></span>
  <a href="./#carte" id="back">Retour au site</a>
  <small id="hint">Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ».</small>
</div>
<main class="sheet" id="sheet"><p>Chargement…</p></main>
<script>
const UI={fr:{dl:'Télécharger en PDF',back:'Retour au site',hint:"Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF ».",tag:"Bar à huîtres · Hendaye",market:'Selon cours',dz:'la douzaine',pay:'Prix nets, taxes et service compris.',al:'Allergènes'},
 es:{dl:'Descargar en PDF',back:'Volver al sitio',hint:'En la ventana de impresión, elija «Guardar como PDF».',tag:'Bar de ostras · Hendaya',market:'Según mercado',dz:'la docena',pay:'Precios netos, impuestos y servicio incluidos.',al:'Alérgenos'},
 en:{dl:'Download as PDF',back:'Back to the site',hint:'In the print window, choose “Save as PDF”.',tag:'Oyster bar · Hendaye',market:'Market price',dz:'per dozen',pay:'Net prices, tax and service included.',al:'Allergens'}};
const AL={amidon:['Amidon','Almidón','Starch'],lait:['Produits laitiers','Lácteos','Dairy'],oeufs:['Œufs','Huevos','Eggs'],gluten:['Gluten','Gluten','Gluten'],poisson:['Poisson','Pescado','Fish'],mollusques:['Mollusques','Moluscos','Molluscs'],sulfites:['Sulfites','Sulfitos','Sulphites'],arachide:['Arachide','Cacahuete','Peanut'],moutarde:['Moutarde','Mostaza','Mustard'],crustaces:['Crustacés','Crustáceos','Crustaceans']};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
let L=new URLSearchParams(location.search).get('lang');if(!['fr','es','en'].includes(L))L='fr';
let C=null;
const li=()=>({fr:0,es:1,en:2})[L];
const tx=(o,k)=>L==='fr'?(o[k]||''):((o.traductions&&o.traductions[L]&&o.traductions[L][k])||o[k]||'');
const price=v=>{const s=String(v||'').trim();if(!s)return UI[L].market;return (L==='en'?s.replace(/,/g,'.'):s)+' €';};
const als=a=>(a&&a.length)?`<span class="al">${UI[L].al} : ${a.map(x=>(AL[x]||[x,x,x])[li()]).join(', ')}</span>`:'';
const item=(n,d,p,a)=>`<div class="it"><b>${esc(n)}</b><span class="p">${esc(p)}</span>${d?`<span class="d">${esc(d)}</span>`:''}${als(a)}</div>`;
function render(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  ['dl','back','hint'].forEach(k=>document.getElementById(k).textContent=UI[L][k]);
  const I=C.infos||{},O=C.huitres||{},K=C.carte||{};
  let h=`<header><h1>${esc(I.nom||'Le Parc à Huîtres')}</h1><p>${UI[L].tag}</p></header><div class="cols">`;
  if((O.liste||[]).length){h+=`<section class="cat"><h2>${esc(tx(O,'titre'))}</h2><div class="sub">${esc(tx(O,'sous_titre'))}</div>`+
    O.liste.map(o=>item(tx(o,'nom')+(o.calibre?' '+o.calibre:''),tx(o,'origine'),price(o.prix),o.allergenes)).join('')+'</section>';}
  (K.categories||[]).forEach(c=>{if(!(c.plats||[]).length)return;h+=`<section class="cat"><h2>${esc(tx(c,'titre'))}</h2><div class="sub">${esc(tx(c,'sous_titre'))}</div>`+
    c.plats.map(p=>item(tx(p,'nom'),tx(p,'description'),price(p.prix),p.allergenes)).join('')+'</section>';});
  h+=`</div><footer><b>${esc(I.nom||'')}</b> · ${esc(I.rue||'')}, ${esc(I.code_postal||'')} ${esc(I.ville||'')} · ${esc(I.telephone||'')}<br>${UI[L].pay}</footer>`;
  document.getElementById('sheet').innerHTML=h;
  document.title=(L==='fr'?'La carte':L==='es'?'La carta':'Menu')+' · '+(I.nom||'Le Parc à Huîtres');
}
Promise.all(['infos','huitres','carte'].map(f=>fetch('content/'+f+'.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({})))).then(([infos,huitres,carte])=>{C={infos,huitres,carte};render();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b&&C){L=b.dataset.l;history.replaceState(null,'','?lang='+L);render();}});
document.getElementById('dl').addEventListener('click',()=>window.print());
</script>
</body>
</html>
