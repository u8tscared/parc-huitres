      fields:
      - name: nom
        label: Nom
        widget: string
      - name: description
        label: Description
        widget: string
        required: false
      - name: prix
        label: Prix (€)
        widget: string
        hint: 'Par exemple 13,80. Pour les vins : 3,90 / 22,80 (verre / bouteille). Vide = « selon cours ».'
        required: false
        pattern: *id001
      - *id002
      - *id003
      - *id004
      - name: traductions
        label: Traductions (espagnol, anglais)
        widget: object
        collapsed: true
        required: false
        hint: 'Si vous changez le français, mettez aussi à jour ces traductions, ou videz-les : le site affichera alors le
          français.'
        fields:
        - name: es
          label: Espagnol
          widget: object
          required: false
