- name: emporter
  label: À emporter
  icon: shopping_bag
  file: content/emporter.json
  fields:
  - name: supplement_ouverture
    label: Supplément huîtres ouvertes (€ par douzaine)
    widget: string
    pattern: *id005
  - name: consigne_petit
    label: Consigne petit plateau (€)
    widget: string
    hint: 'Petit plateau : jusqu''à 2 douzaines d''huîtres ouvertes.'
    pattern: *id005
  - name: consigne_grand
    label: Consigne grand plateau (€)
    widget: string
    hint: 'Grand plateau : 3 douzaines.'
    pattern: *id005
  - name: retrait
    label: Créneaux de retrait
    widget: object
    fields:
    - name: midi_debut
      label: 'Midi : premier retrait'
      widget: datetime
      type: time
      format: HH:mm
    - name: midi_fin
      label: 'Midi : dernier retrait'
      widget: datetime
      type: time
      format: HH:mm
    - name: soir_debut
      label: 'Soir : premier retrait'
      widget: datetime
      type: time
      format: HH:mm
    - name: soir_fin
      label: 'Soir : dernier retrait'
      widget: datetime
      type: time
      format: HH:mm
    - name: intervalle
      label: Écart entre deux créneaux (minutes)
      widget: number
      value_type: int
      min: 5
      max: 120
      default: 30
    - name: delai
      label: Délai minimum le jour même (minutes)
      widget: number
      value_type: int
      min: 0
      max: 480
      default: 30
      hint: 'Exemple : 30 = on ne peut pas commander pour dans moins de 30 minutes.'
    - name: jours_affiches
      label: Nombre de jours proposés
      widget: number
      value_type: int
      min: 1
      max: 14
      default: 4
      hint: Les jours de fermeture sont sautés automatiquement.
  - name: produits
    label: Produits à emporter (hors huîtres)
    label_singular: produit
    widget: list
    summary: '{{fields.nom}} · {{fields.prix}} €'
    collapsed: true
    fields:
    - name: rayon
      label: Rayon
      widget: select
      options:
      - label: Plateaux
        value: plateaux
      - label: Coquillages & crustacés
        value: coquillages
      - label: Petites assiettes
        value: assiettes
      - label: Sortie de cuisine
        value: cuisine
      - label: Desserts
        value: desserts
      - label: Vins
        value: vins
      - label: Boissons
        value: soifs
      hint: Le nom du rayon reprend celui de la rubrique de la carte.
    - name: nom
      label: Nom
      widget: string
    - name: description
      label: Description
      widget: text
      required: false
    - name: prix
      label: Prix à emporter (€)
      widget: string
      pattern: *id005
    - name: toujours_ouvert
      label: Plateau ouvert (avec consigne)
      widget: boolean
      default: false
      hint: À cocher pour un plateau toujours servi ouvert.
    - *id002
    - *id003
    - *id004
    - name: traductions
      label: Traductions (espagnol, anglais)
      widget: object
      collapsed: true
      required: false
      hint: 'Si vous changez le français, mettez aussi à jour ces traductions, ou videz-les : le site affichera alors le français.'
      fields:
      - name: es
        label: Espagnol
        widget: object
        required: false
        fields:
        - name: nom
          label: Nom
          widget: string
          required: false
        - name: description
          label: Description
          widget: text
          required: false
      - name: en
        label: Anglais
        widget: object
        required: false
        fields:
        - name: nom
          label: Nom
          widget: string
          required: false
        - name: description
          label: Description
          widget: text
          required: false
