# Configuration de l'espace admin (Sveltia CMS).
# Chaque bloc « singletons » correspond à un fichier de content/ que l'équipe modifie depuis /admin/.
# Documentation : https://sveltiacms.app/en/docs

backend:
  name: github
  repo: u8tscared/parc-huitres
  branch: main
  auth_methods:
  - token
  commit_messages:
    update: 'Admin : mise à jour de {{path}}'
app_title: Admin · Le Parc à Huîtres
site_url: https://u8tscared.github.io/parc-huitres/
logo:
  src: https://u8tscared.github.io/parc-huitres/icon-192.png
media_folder: images
public_folder: images
editor:
  preview: false
singletons:
- name: etat
  label: Fermé / complet
  icon: toggle_on
  file: content/etat.json
  fields:
  - name: mode
    label: État d'aujourd'hui
    widget: select
    default: normal
    options:
    - label: Normal
      value: normal
    - label: Complet (plus de tables, l'emporter reste ouvert)
      value: complet
    - label: Fermé (ni tables ni emporter)
      value: ferme
    hint: Un bandeau s'affiche en haut du site, et la réservation (et l'emporter si fermé) est bloquée pour ce jour.
  - name: jour
    label: Pour le jour
    widget: datetime
    type: date
    format: YYYY-MM-DD
    required: false
    hint: 'Mettez la date du jour : le lendemain, le site redevient normal tout seul. Vide = reste actif jusqu''à ce que vous
      remettiez « Normal ».'
  - name: message
    label: Message du bandeau (facultatif)
    widget: object
    hint: Vide = « Complet aujourd'hui » ou « Fermé aujourd'hui ».
    fields:
    - name: fr
      label: Français
      widget: string
      required: false
    - name: es
      label: Espagnol
      widget: string
      hint: 'Si vous changez le français, changez aussi ce texte, ou videz-le : le français sera affiché.'
      required: false
    - name: en
      label: Anglais
      widget: string
      hint: 'Si vous changez le français, changez aussi ce texte, ou videz-le : le français sera affiché.'
      required: false
    required: false
- name: infos
  label: Coordonnées
  icon: contact_phone
  file: content/infos.json
  fields:
  - name: nom
    label: Nom du restaurant
    widget: string
  - name: rue
    label: Adresse (rue)
    widget: string
  - name: code_postal
    label: Code postal
    widget: string
  - name: ville
    label: Ville
    widget: string
  - name: telephone
    label: Téléphone
    widget: string
    hint: Format 05 59 20 32 38
    pattern:
    - ^0\d( ?\d\d){4}$
    - Écrivez le numéro comme 05 59 20 32 38
  - name: email
    label: E-mail de contact
    widget: string
    type: email
  - name: instagram
    label: Lien Instagram
    widget: string
    required: false
    type: url
  - name: facebook
    label: Lien Facebook
    widget: string
    required: false
    type: url
  - name: google_note
    label: Note Google
    widget: string
    hint: Par exemple 4,6
    pattern:
    - ^[0-5]([,.]\d)?$
    - Une note entre 0 et 5, par exemple 4,6
  - name: google_avis
    label: Nombre d'avis Google
    widget: number
    value_type: int
    min: 0
- name: horaires
  label: Horaires
  icon: schedule
  file: content/horaires.json
  fields:
  - name: jours
    label: Semaine type
    widget: list
    allow_add: false
    allow_remove: false
    allow_reorder: false
    collapsed: false
    summary: '{{fields.jour}}'
    hint: Changez ces horaires à chaque saison. Un jour fermé n'a pas de service.
    fields:
    - name: jour
      label: Jour
      widget: string
      readonly: true
    - name: ouvert
      label: Ouvert ce jour-là
      widget: boolean
      default: true
    - name: services
      label: Services
      label_singular: service
      widget: list
      required: false
      summary: '{{fields.debut}} – {{fields.fin}}'
      hint: Midi puis soir, par exemple 11:00 – 15:00 et 18:00 – 23:00.
      fields:
      - name: debut
        label: Ouverture
        widget: datetime
        type: time
        format: HH:mm
      - name: fin
        label: Fermeture
        widget: datetime
        type: time
        format: HH:mm
  - name: fermetures
    label: Fermetures exceptionnelles
    label_singular: fermeture
    widget: list
    required: false
    summary: '{{fields.du}} → {{fields.au}} {{fields.motif}}'
    hint: Congés, jours fériés… Le site affiche « Fermé » et bloque le retrait à emporter ces jours-là. Les dates passées
      sont ignorées.
    fields:
    - name: du
      label: Du
      widget: datetime
      type: date
      format: YYYY-MM-DD
    - name: au
      label: Au (inclus)
      widget: datetime
      type: date
      format: YYYY-MM-DD
      required: false
    - name: motif
      label: Motif (facultatif)
      widget: string
      required: false
  - name: annonce
    label: Message en haut du site
    widget: object
    hint: Par exemple « Horaires d'hiver à partir du 1er novembre ». Laissez vide pour ne rien afficher.
    fields:
    - name: fr
      label: Français
      widget: text
      required: false
    - name: es
      label: Espagnol
      widget: text
      hint: 'Si vous changez le français, changez aussi ce texte, ou videz-le : le français sera affiché.'
      required: false
    - name: en
      label: Anglais
      widget: text
      hint: 'Si vous changez le français, changez aussi ce texte, ou videz-le : le français sera affiché.'
      required: false
    required: false
- name: huitres
