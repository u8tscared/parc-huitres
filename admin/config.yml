    required: false
    hint: 'Si vous changez le français, mettez aussi à jour ces traductions, ou videz-les : le site affichera alors le français.'
    fields:
    - name: es
      label: Espagnol
      widget: object
      required: false
      fields:
      - name: titre
        label: Titre
        widget: string
        required: false
      - name: sous_titre
        label: Sous-titre
        widget: string
        required: false
    - name: en
      label: Anglais
      widget: object
      required: false
      fields:
      - name: titre
        label: Titre
        widget: string
        required: false
      - name: sous_titre
        label: Sous-titre
        widget: string
        required: false
  - name: liste
    label: Huîtres
    label_singular: huître
    widget: list
    summary: '{{fields.nom}} {{fields.calibre}} · {{fields.prix}} €'
    fields:
    - name: nom
      label: Nom
      widget: string
      hint: Par exemple Fines de Claires
    - name: calibre
      label: Calibre
      widget: string
      hint: Par exemple n°3
      required: false
    - name: origine
      label: Origine ou petite ligne
      widget: string
      required: false
    - name: prix
      label: Prix sur place (la douzaine)
      widget: string
      hint: Vide = « selon cours »
      required: false
      pattern: &id001
      - ^(\d+([,.]\d{1,2})?( / \d+([,.]\d{1,2})?)?)?$
      - Écrivez le prix comme 26,40 (ou 3,90 / 22,80 pour verre / bouteille)
    - name: a_emporter
      label: Proposée à emporter
      widget: boolean
      default: true
    - name: prix_emporter
      label: Prix à emporter (la douzaine, fermées)
      widget: string
      hint: Le supplément pour les huîtres ouvertes se règle dans « À emporter ».
      required: false
      pattern: &id005
      - ^\d+([,.]\d{1,2})?$
      - Écrivez un prix simple, par exemple 19,20
    - name: iode
      label: Niveau d'iode (1 à 5)
      widget: number
      value_type: int
      min: 1
      max: 5
      default: 3
    - name: description
      label: Description (carte de l'accueil)
      widget: text
      required: false
    - &id002
      name: allergenes
      label: Allergènes
      widget: select
      multiple: true
      required: false
