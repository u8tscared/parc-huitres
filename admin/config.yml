- name: mentions
  label: Mentions légales
  icon: gavel
  file: content/mentions.json
  fields:
  - name: raison_sociale
    label: Raison sociale
    widget: string
    hint: Le nom de la société, tel que sur le Kbis.
    required: false
  - name: forme_juridique
    label: Forme juridique
    widget: string
    hint: SARL, SAS, EI…
    required: false
  - name: capital
    label: Capital social
    widget: string
    hint: Par exemple 10 000 €
    required: false
  - name: siege
    label: Adresse du siège
    widget: string
    required: false
  - name: siret
    label: SIRET
    widget: string
    required: false
    pattern:
    - ^(\d ?){14}$|^$
    - 14 chiffres
  - name: rcs
    label: RCS
    widget: string
    hint: Par exemple RCS Bayonne 123 456 789
    required: false
  - name: tva
    label: N° de TVA intracommunautaire
    widget: string
    required: false
  - name: directeur_publication
    label: Directeur ou directrice de la publication
    widget: string
    hint: La personne responsable du site (souvent le gérant).
    required: false
  - name: hebergeur_nom
    label: Hébergeur
    widget: string
  - name: hebergeur_adresse
    label: Adresse de l'hébergeur
    widget: string
  - name: hebergeur_site
    label: Site de l'hébergeur
    widget: string
    type: url
  - name: autres
    label: Autres mentions (facultatif)
    widget: text
    hint: Médiateur de la consommation, crédits…
    required: false
  - name: cookies
    label: Données personnelles et cookies
    widget: text
